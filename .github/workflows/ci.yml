name: CI

# Lint and the CPU test suite on every push and PR to main.
# GPU-marked tests are excluded here by design: CLAUDE.md requires every test in
# `tests/` to run on CPU in under 5 seconds, and `-m "not gpu"` is the contract
# that keeps that promise enforceable on a runner with no CUDA device.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only torch. The default wheels pull ~2.5 GB of CUDA libraries that a
      # runner can neither use nor fit comfortably; this index serves the same
      # torch/torchvision versions built without them.
      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Test (CPU only)
        run: pytest -m "not gpu" -q
