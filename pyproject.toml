[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cifar"
version = "0.1.0"
description = "CIFAR-10 training project"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pyyaml",
    "tensorboard",
    "matplotlib",
    "rich",
]

[project.optional-dependencies]
# ruff is pinned: `ruff format --check` is a CI gate, and formatting output shifts
# between ruff releases, so an unpinned version turns an unrelated upstream release
# into a red build on unmodified code.
dev = ["pytest", "ruff==0.16.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
markers = ["gpu: marks tests that require a GPU"]
